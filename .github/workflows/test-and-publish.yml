name: Test & Publish
permissions:
  contents: read
'on':
  push:
    branches:
      - trunk
  pull_request:
    branches:
      - trunk
jobs:
  warm-cache:
    uses: ./.github/workflows/update-dependencies-cache.yml
    with:
      ref: '${{ github.ref }}'
  lint:
    needs: warm-cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 24.x
      - id: cache-dependencies
        uses: actions/cache@8b402f58fbc84540c8b491a91e594a4576fec3d7 # v5.0.2
        with:
          path: node_modules
          key: ${{ runner.os }}-node-24.x-${{ hashFiles('**/package-lock.json') }}
      - name: Ensure cache exists
        if: steps.cache-dependencies.outputs.cache-hit != 'true'
        run: exit 1
      - name: Setup Biome
        uses: biomejs/setup-biome@b2d22cfd9a11c0950398a316e08e17cf3891e85c # v2.7.0
        with:
          version: latest
      - name: Check linting & code formatting
        run: biome check
  test-22:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 22.x
      - id: cache-dependencies
        uses: actions/cache@8b402f58fbc84540c8b491a91e594a4576fec3d7 # v5.0.2
        with:
          path: node_modules
          key: >-
            ${{ runner.os }}-node-22.x-${{
            hashFiles('**/package-lock.json') }}
      - name: Ensure cache exists
        if: steps.cache-dependencies.outputs.cache-hit != 'true'
        run: |
          echo "Cache miss! Update cached dependencies required."
          exit 1
      - name: Test project
        run: npm test
  test-24:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 24.x
      - id: cache-dependencies
        uses: actions/cache@8b402f58fbc84540c8b491a91e594a4576fec3d7 # v5.0.2
        with:
          path: node_modules
          key: >-
            ${{ runner.os }}-node-24.x-${{
            hashFiles('**/package-lock.json') }}
      - name: Ensure cache exists
        if: steps.cache-dependencies.outputs.cache-hit != 'true'
        run: |
          echo "Cache miss! Update cached dependencies required."
          exit 1
      - name: Test project
        run: npm test
  publish-npm:
    needs:
      - test-22
      - test-24
    if: github.event_name == 'push' && github.ref == 'refs/heads/trunk'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org/'
      - id: cache-dependencies
        uses: actions/cache@8b402f58fbc84540c8b491a91e594a4576fec3d7 # v5.0.2
        with:
          path: node_modules
          key: ${{ runner.os }}-node-24.x-${{ hashFiles('**/package-lock.json') }}
      - name: Ensure cache exists
        if: steps.cache-dependencies.outputs.cache-hit != 'true'
        run: |
          echo "Cache miss! Update cached dependencies required."
          exit 1
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{secrets.NPM_BEACON_PUBLISH_TOKEN}}
